apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow
  annotations:
    # Workload Identity: writes artifacts to GCS without keys.
    iam.gke.io/gcp-service-account: llm-p2p-mlflow@hl-llm-p2p-261007.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels: &labels
    app.kubernetes.io/name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: mlflow
      nodeSelector:
        pool: system
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: mlflow
          args:
            - --host=0.0.0.0
            - --port=5000
            - --workers=2
            - --backend-store-uri=$(DB_URI)
            - --artifacts-destination=gs://hl-llm-p2p-261007-mlflow/artifacts
            - --serve-artifacts
            - --allowed-hosts=mlflow.mlops,mlflow.mlops:5000,mlflow.mlops.svc.cluster.local:5000,localhost,localhost:5000
          env:
            - name: DB_URI
              valueFrom:
                secretKeyRef: {name: mlflow-db-app, key: uri}
            - name: HOME
              value: /tmp
          ports:
            - {name: http, containerPort: 5000}
          resources:
            requests: {cpu: 200m, memory: 768Mi}
            limits: {memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
spec:
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - {name: http, port: 5000, targetPort: http}
