apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - rules.yaml
# Grafana's sidecar loads every ConfigMap labelled grafana_dashboard=1.
# Regenerate the JSON with: python3 tools/gen_dashboards.py
configMapGenerator:
  - name: dashboards-lending-assistant
    files:
      - dashboards/lending-assistant.json
      - dashboards/model-server.json
      - dashboards/platform-health.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
