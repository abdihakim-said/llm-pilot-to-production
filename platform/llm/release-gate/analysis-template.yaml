# The release gate. Runs during every assistant-api canary:
#  1. the evaluation suite against canary pods only (separate, pinned evaluator image)
#  2. live error rate of the canary from Prometheus
# Any failure aborts the rollout and Argo Rollouts returns all traffic to stable.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: release-gate
spec:
  args:
    - name: rollout
  metrics:
    - name: evaluation-suite
      count: 1
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 1200
            ttlSecondsAfterFinished: 86400
            template:
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                nodeSelector:
                  pool: system
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 10001
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: evaluator
                    image: evaluator
                    args: ["--target=http://assistant-api-canary.llm", "--expect-track=canary"]
                    env:
                      - name: MLFLOW_TRACKING_URI
                        value: http://mlflow.mlops:5000
                      - name: ROLLOUT_NAME
                        value: "{{args.rollout}}"
                      - name: MLFLOW_HTTP_REQUEST_MAX_RETRIES
                        value: "2"
                    resources:
                      requests: {cpu: 100m, memory: 256Mi}
                      limits: {memory: 512Mi}
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
                    volumeMounts:
                      - {name: tmp, mountPath: /tmp}
                volumes:
                  - name: tmp
                    emptyDir: {}
    - name: canary-error-rate
      initialDelay: 30s
      interval: 30s
      count: 4
      failureLimit: 1
      successCondition: result[0] <= 0.05
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring:9090
          query: |
            (sum(rate(assistant_requests_total{track="canary",outcome="error"}[2m])) or vector(0))
            /
            clamp_min(sum(rate(assistant_requests_total{track="canary"}[2m])), 1e-9)
