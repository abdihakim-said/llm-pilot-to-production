apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rollout.yaml
  - service.yaml
# The image is pinned by digest by the build pipeline (.github/workflows/build-image.yml).
images:
  - name: assistant-api
    newName: europe-west2-docker.pkg.dev/hl-llm-p2p-261007/llm-p2p/assistant-api
    newTag: pending-first-build
# Rollouts doesn't understand image references in its CRD without this.
configurations:
  - rollout-transform.yaml
