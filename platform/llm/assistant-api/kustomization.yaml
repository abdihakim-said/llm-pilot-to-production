images:
- digest: sha256:b6fab1d41ed9f7b72d6040eb9bee8e4231eb7c1d86e7164b01341d67fefeca33
  name: assistant-api
  newName: europe-west2-docker.pkg.dev/hl-llm-p2p-261007/llm-p2p/assistant-api
