# Reusable: build, scan, sign and publish one app image, then pin it in GitOps.
name: build-image

on:
  workflow_call:
    inputs:
      app:
        description: Directory under apps/ and image name
        required: true
        type: string

env:
  REGISTRY: europe-west2-docker.pkg.dev/hl-llm-p2p-261007/llm-p2p
  WIF_PROVIDER: projects/1033066962016/locations/global/workloadIdentityPools/github/providers/github
  CI_SA: llm-p2p-ci@hl-llm-p2p-261007.iam.gserviceaccount.com

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit the new image tag to GitOps
      id-token: write   # keyless auth to GCP and keyless cosign signing
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SA }}
          token_format: access_token

      - uses: docker/login-action@v4
        with:
          registry: europe-west2-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: apps/${{ inputs.app }}
          load: true
          tags: ${{ env.REGISTRY }}/${{ inputs.app }}:${{ github.sha }}
          build-args: RELEASE=r${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}

      - name: Scan (block on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ inputs.app }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push
        id: push
        run: |
          docker push "$REGISTRY/${{ inputs.app }}:${{ github.sha }}"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$REGISTRY/${{ inputs.app }}:${{ github.sha }}")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign (keyless, GitHub OIDC)
        run: cosign sign --yes "$REGISTRY/${{ inputs.app }}@${{ steps.push.outputs.digest }}"

      - name: Pin digest in GitOps
        run: |
          cd platform/llm/${{ inputs.app }}
          kustomize edit set image "${{ inputs.app }}=$REGISTRY/${{ inputs.app }}@${{ steps.push.outputs.digest }}"
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add kustomization.yaml
          git commit -m "release(${{ inputs.app }}): r${{ github.run_number }} ${{ github.sha }}"
          git pull --rebase origin main
          git push origin HEAD:main
